<title id="title">SOVEL application architecture</title>
<desc id="desc">The browser sends questions and supported documents to the application service. Documents follow a text extraction or OCR path. Guest AI requests pass usage checks before cloud inference. Local installations can use Ollama. Structured results return through validation for display.</desc>
